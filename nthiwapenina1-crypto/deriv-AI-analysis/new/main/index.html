<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deriv MATCHES AI</title><style>body{background:#0a0e13;color:#fff;font-family:sans-serif;padding:12px;margin:0}.c{background:#121a26;border:1px solid #1e2d45;border-radius:16px;padding:16px;margin-bottom:12px}h1{font-size:18px;text-align:center;color:#00ff88;margin:0 0 10px}.p{font-size:32px;font-weight:900;text-align:center}.d{font-size:60px;font-weight:900;text-align:center;color:#00ff88}select,button{width:100%;padding:14px;background:#1a2638;border:1px solid #2a3f5f;color:#fff;border-radius:10px;margin-top:8px}button{background:#00ff88;color:#000;font-weight:900;font-size:18px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.s{background:#0f1825;padding:10px;border-radius:10px;text-align:center;font-size:12px}#st{font-size:11px;text-align:center;color:#888}</style></head><body><div class="c"><h1>🤖 DERIV MATCHES AI - LIVE</h1><div id="st">Connecting...</div><div id="price" class="p">-</div><div id="digit" class="d">-</div><div class="g"><div class="s">Last 10<div id="last">-</div></div><div class="s">Match %<div id="mp">0%</div></div></div></div><div class="c"><select id="target"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option></select><div class="g"><div class="s">PRED<b id="pred" style="display:block;color:#00ff88">WAIT</b></div><div class="s">CONF<b id="conf" style="display:block">0%</b></div></div><button onclick="analyze()">🔍 ANALYZE MATCHES</button><div id="res" style="margin-top:10px;padding:12px;background:#1a2638;border-radius:10px;text-align:center"></div></div><script>let digits=[];function conn(){let w=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');w.onopen=()=>{document.getElementById('st').innerText='✅ LIVE';w.send(JSON.stringify({ticks:'R_10',subscribe:1}))};w.onmessage=(e)=>{let d=JSON.parse(e.data);if(d.tick){let q=d.tick.quote.toString();let dig=parseInt(q.slice(-1));if(isNaN(dig))return;document.getElementById('price').innerText=q;document.getElementById('digit').innerText=dig;digits.unshift(dig);if(digits.length>100)digits.pop();document.getElementById('last').innerText=digits.slice(0,10).join(', ');let t=parseInt(document.getElementById('target').value);let m=digits.filter(x=>x==t).length;document.getElementById('mp').innerText=Math.round(m/digits.length*100||0)+'%'}};w.onclose=()=>{document.getElementById('st').innerText='Reconnecting...';setTimeout(conn,2000)}}conn();function analyze(){let t=parseInt(document.getElementById('target').value);if(digits.length<20){document.getElementById('res').innerText='Wait '+digits.length+'/20 ticks...';return}let s=digits.slice(0,50);let m=s.filter(x=>x==t).length;let p=Math.round(m/50*100);let pr=p>=25?'MATCHES ✅':'DIFFERS ❌';document.getElementById('pred').innerText=pr;document.getElementById('conf').innerText=p+'%';document.getElementById('res').innerHTML='Target '+t+': '+m+'/50 = '+p+'%<br><b style="color:#00ff88;font-size:22px">'+pr+'</b><br>Advice: '+(p>=25?'TRADE MATCHES':'TRADE DIFFERS')}}</script></body></html>
