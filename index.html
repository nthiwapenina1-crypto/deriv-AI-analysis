<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deriv AI MATCHES</title><style>body{background:#0a0e13;color:#fff;font-family:sans-serif;padding:12px;margin:0}.c{background:#121a26;border:1px solid #1e2d45;border-radius:16px;padding:16px;margin-bottom:12px}h1{font-size:20px;text-align:center;color:#00ff88}.p{font-size:40px;font-weight:900;text-align:center}.d{font-size:60px;font-weight:900;text-align:center;color:#00ff88}select,button{width:100%;padding:14px;background:#1a2638;border:1px solid #2a3f5f;color:#fff;border-radius:10px;margin-top:8px}button{background:#00ff88;color:#000;font-weight:900;font-size:18px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.s{background:#0f1825;padding:10px;border-radius:10px;text-align:center}</style></head><body><div class="c"><h1>🤖 DERIV AI - MATCHES/DIFFERS</h1><div id="price" class="p">-</div><div id="digit" class="d">-</div><div class="g"><div class="s">Last<div id="last">-</div></div><div class="s">Match %<div id="mp">0%</div></div></div></div><div class="c"><select id="target"><option value="0">Target 0</option><option value="1">Target 1</option><option value="2">Target 2</option><option value="3">Target 3</option><option value="4">Target 4</option><option value="5">Target 5</option><option value="6">Target 6</option><option value="7">Target 7</option><option value="8">Target 8</option><option value="9">Target 9</option></select><div class="g"><div class="s">PREDICTION<b id="pred">WAIT</b></div><div class="s">CONF<b id="conf">0%</b></div></div><button onclick="analyze()">🔍 ANALYZE MATCHES</button><div id="result" style="margin-top:10px;padding:10px;background:#1a2638;border-radius:10px;text-align:center"></div></div><script>let digits=[];let ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');ws.onopen=()=>ws.send(JSON.stringify({ticks:'R_10'}));ws.onmessage=(m)=>{let d=JSON.parse(m.data);if(d.tick){let price=d.tick.quote;let digit=parseInt(price.toString().slice(-1));document.getElementById('price').innerText=price;document.getElementById('digit').innerText=digit;digits.unshift(digit);if(digits.length>100)digits.pop();document.getElementById('last').innerText=digits.slice(0,10).join(',');let target=parseInt(document.getElementById('target').value);let matches=digits.filter(x=>x==target).length;let pct=Math.round(matches/digits.length*100||0);document.getElementById('mp').innerText=pct+'%';}};function analyze(){let target=parseInt(document.getElementById('target').value);if(digits.length<20){document.getElementById('result').innerText='Wait 20 ticks...';return}let matches=digits.slice(0,50).filter(x=>x==target).length;let pct=Math.round(matches/50*100);let pred=pct>25?'MATCHES ✅':'DIFFERS ❌';let conf=pct>30?'85%':pct>20?'65%':'45%';document.getElementById('pred').innerText=pred;document.getElementById('conf').innerText=conf;document.getElementById('result').innerHTML='Target '+target+'<br>Last 50: '+matches+' matches ('+pct+'%)<br><b style="color:#00ff88;font-size:20px">'+pred+' - '+conf+'</b>';}</script></body></html>
